input_driver = "udev"
input_device = "Modulino Gamepad"
input_vendor_id = "9025"
input_product_id = "49153"

# Button indices come from joydev ordering of KEY caps (ascending code).
# 0:A 1:B 2:X 3:Y 4:TL 5:Select 6:Start 7:DPad-Up 8:DPad-Down 9:DPad-Left 10:DPad-Right
input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_select_btn = "5"
input_start_btn = "6"

input_up_btn = "7"
input_down_btn = "8"
input_left_btn = "9"
input_right_btn = "10"

# Hotkey: hold SELECT (button 5) and:
#   + START (6)        — close the running game and return to the menu
#                        (also triggers the rotation watcher to flip Xorg
#                        back to landscape)
#   + L1 / J-press (4) — open the RetroArch menu (overlay over game)
input_enable_hotkey_btn = "5"
input_menu_toggle_btn = "4"
input_close_content_btn = "6"
