# Kiosk overrides appended to ~/.config/retroarch/retroarch.cfg by setup.sh.
# Re-running setup.sh is idempotent (block is replaced, not duplicated).

# Cores installed by libretro-* apt packages
libretro_directory = "/usr/lib/aarch64-linux-gnu/libretro"
libretro_info_path = "/usr/share/libretro/info"

# UI assets (icons, cursor, fonts) — downloaded by setup.sh from
# buildbot.libretro.com because Debian doesn't ship a retroarch-assets package.
assets_directory = "~/.config/retroarch/assets"
menu_driver = "ozone"
kiosk_mode_enable = "true"

# Audio — route through PipeWire's PulseAudio shim (pipewire-pulse is active;
# WirePlumber auto-configures the Imola codec headphone path on card 0). The
# default RetroArch profile ships with audio_mute_enable=true, which silences
# games even though the system sink works — pin it off here.
audio_enable = "true"
audio_driver = "pulse"
audio_mute_enable = "false"
audio_mixer_mute_enable = "false"
audio_volume = "0.0"

# Network command interface — listened to by ra-rotate-watcher.service which
# flips Xorg rotation between menu (rotated, landscape) and game (native
# portrait, RA's video_rotation does the rotation inside the swapchain so
# scrolling doesn't tear).
network_cmd_enable = "true"
network_cmd_port = "55355"

video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_smooth = "false"
pause_nonactive = "false"
config_save_on_exit = "false"

# Anti-tearing: vsync + hard sync + small swapchain. xfwm4 compositor is
# also disabled by setup.sh (compositor decouples RetroArch's vsync from
# the panel scanout, causing visible tearing).
video_vsync = "true"
video_hard_sync = "true"
video_hard_sync_frames = "0"
video_max_swapchain_images = "3"
video_waitable_swapchains = "true"
video_threaded = "false"
video_frame_delay_auto = "true"
video_frame_delay = "0"
# DSI video-mode panels tear under the X11 GL driver because page flips
# don't always align with the calculated VBLANK. Vulkan goes through DRM
# atomic and presents tear-free on the msm driver.
video_driver = "vulkan"

# Display sits at native portrait 800x1280; we rotate inside RetroArch so the
# scanout never goes through Xorg's software rotation copy pass (which races
# the panel scanout and produces a fixed tearline). video_rotation=3 = 270 deg
# = 90 deg CW, matching how the user holds the panel.
video_rotation = "1"
menu_rotation = "1"
video_allow_rotate = "true"

# Quit/menu behavior — disable Escape quitting RA so kiosk doesn't fall to
# XFCE on a stray keypress. F1 still toggles the menu; Select+Start does the
# same on the Modulino gamepad.
confirm_on_exit = "true"
quit_press_twice = "true"
input_exit_emulator = "nul"

# Hide mouse cursor in fullscreen
video_disable_composition = "true"

# Default ROM browser path
rgui_browser_directory = "~/roms"

# Save / state directories
savefile_directory = "~/.config/retroarch/saves"
savestate_directory = "~/.config/retroarch/states"
