# Mono downmix sink for the Earphones Out jack (earpiece audio mode).
# Installed to ~/.config/pipewire/pipewire.conf.d/ ONLY on units with
# /etc/kiosk-audio-output = earpiece (see setup.sh / audio-tune.sh).
#
# The earpiece jack carries a single differential channel fed from hw ch0 of
# the Earphones PCM; a plain stereo sink would silently drop the right game
# channel (PipeWire links stereo streams positionally, it does not downmix
# unless the channel counts differ). Opening the PCM in true mono stalls the
# Qualcomm CODEC-DMA (hw_ptr barely advances), so instead:
#   stereo stream --downmix--> "Speaker" mono sink --upmix--> Earphones FL+FR
# and the codec picks up hw ch0 = the full FL+FR mix.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Speaker"
      capture.props = {
        node.name = "earpiece_mono"
        media.class = Audio/Sink
        audio.position = [ MONO ]
      }
      playback.props = {
        node.name = "earpiece_mono.output"
        audio.position = [ MONO ]
        target.object = "alsa_output.platform-sound.Earphones__Earphones__sink"
        node.passive = true
      }
    }
  }
]
